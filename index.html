<!DOCTYPE html>
<html>
<head>
    <title>Holiday Lifer Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5em;
        }

        .box {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>🐿️ Holiday Lifer Finder</h1>

<div class="box">

    <p>
        Enter your iNaturalist username:
    </p>

    <input id="username" value="squirrel_cheeks">

    <button onclick="loadObservations()">
        Find my observations
    </button>

    <div id="results">
        Results will appear here...
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
